<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" role="img" aria-labelledby="title desc">
  <title id="title">Relay + Soju: three separate hops</title>
  <desc id="desc">Browser to Relay uses HTTPS and WebSocket. Relay backend to Soju uses IRC over TLS with the Soju account. Soju to IRC networks uses separate upstream authentication. No IRC reverse proxy is required.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60758c"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #182d42; }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 25px; font-weight: 700; }
    .body { font-size: 22px; }
    .label { font-size: 21px; fill: #405870; }
    .arrow { fill: none; stroke: #60758c; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="640" height="1070" rx="20" fill="#f5f8fc"/>
  <text x="32" y="52" class="title">Relay + Soju: three separate hops</text>
  <text x="32" y="87" class="label">Web access and IRC access are different paths.</text>
  <rect x="32" y="112" width="576" height="97" rx="12" fill="#ffffff" stroke="#c9d5e2"/>
  <text x="56" y="149" class="heading">1  Browser / Relay app</text>
  <text x="56" y="184" class="body">Displays messages and network settings.</text>
  <path class="arrow" d="M 70 209 V 299"/>
  <text x="100" y="246" class="body">HTTPS / WebSocket</text>
  <text x="100" y="278" class="label">Optional web proxy or tunnel</text>
  <rect x="32" y="310" width="576" height="97" rx="12" fill="#ffffff" stroke="#c9d5e2"/>
  <text x="56" y="347" class="heading">2  Relay backend</text>
  <text x="56" y="382" class="body">Connects to Soju as an IRC client.</text>
  <path class="arrow" d="M 70 407 V 497"/>
  <text x="100" y="444" class="body">IRC over TLS · usually port 6697</text>
  <text x="100" y="476" class="label">SASL PLAIN: Soju account + password</text>
  <rect x="32" y="508" width="576" height="126" rx="12" fill="#e2f2ef" stroke="#7bb8ad"/>
  <text x="56" y="545" class="heading">3  Soju bouncer</text>
  <text x="56" y="580" class="body">Keeps upstream IRC sessions connected,</text>
  <text x="56" y="609" class="body">even when Relay is restarted.</text>
  <path class="arrow" d="M 70 634 V 732"/>
  <text x="100" y="674" class="body">IRC over TLS</text>
  <text x="100" y="706" class="label">Upstream SASL PLAIN or client CertFP</text>
  <rect x="32" y="743" width="576" height="97" rx="12" fill="#ffffff" stroke="#c9d5e2"/>
  <text x="56" y="780" class="heading">4  IRC networks</text>
  <text x="56" y="815" class="body">Each has its own account and services.</text>
  <rect x="32" y="880" width="576" height="155" rx="12" fill="#e9eef8"/>
  <text x="56" y="916" class="heading">No IRC reverse proxy required</text>
  <text x="56" y="953" class="body">Use a resolvable hostname, matching TLS</text>
  <text x="56" y="982" class="body">certificate, and reachable Soju listener.</text>
  <text x="56" y="1011" class="body">The hostname setting alone is not DNS.</text>
</svg>
